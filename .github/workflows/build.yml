name: Build lsdriver

on:
  workflow_dispatch:
    inputs:
      strip_debug:
        description: Strip debug symbols (Android 15/16 always keep symbols)
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android:
          - android16-6.12
          - android15-6.6
          - android14-6.1
          - android13-5.15
          - android13-5.10
          - android12-5.10

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.android }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build kernel module with DDK script
        shell: bash
        env:
          STRIP_CHOICE: ${{ inputs.strip_debug && 'y' || 'n' }}
          DDK_TARGET: ${{ matrix.android }}
        run: bash ./ddk_build_all.sh "$DDK_TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ matrix.android }}
          path: lsdriver/${{ matrix.android }}lsdriver.ko
          if-no-files-found: error
