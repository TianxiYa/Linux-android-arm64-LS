name: Build lsdriver

on:
  workflow_dispatch:
    inputs:
      strip_debug:
        description: Strip debug symbols (Android 15/16/17 always keep symbols)
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - android: android17-6.18
            module: 6.18-Android17
          - android: android16-6.12
            module: 6.12-Android16
          - android: android15-6.6
            module: 6.6-Android15
          - android: android14-6.1
            module: 6.1-Android14
          - android: android13-5.15
            module: 5.15-Android13
          - android: android13-5.10
            module: 5.10-Android13
          - android: android12-5.10
            module: 5.10-Android12

    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.android }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build kernel module with DDK script
        shell: bash
        env:
          STRIP_CHOICE: ${{ inputs.strip_debug && 'y' || 'n' }}
          DDK_TARGET: ${{ matrix.android }}
        run: bash ./ddk_build_all.sh "$DDK_TARGET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ matrix.android }}
          path: lsdriver/byte_stream/${{ matrix.module }}.ko
          if-no-files-found: error
